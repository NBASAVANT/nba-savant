<style>
:root{
  --navy:#0b1530;--blue:#1d428a;--red:#c8102e;--surface:#eef1f7;--tint:#f1f4fa;
  --rule:#e4e8ef;--rule2:#d5dae4;--t2:#3a4357;--t3:#5b6478;--t4:#8a93a6;
  --rise:#1f8a4c;--fall:#c2341f;--court:rgba(11,21,48,.16);
  --grad:linear-gradient(90deg,hsl(0 88% 47%),hsl(60 88% 47%),hsl(120 88% 47%));
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#fff}
body{font-family:Archivo,system-ui,sans-serif;color:var(--navy);background:#fff;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;line-height:1.25}
button,input{font-family:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.app{max-width:1440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- shared bits ---------- */
.av{position:relative;border-radius:50%;background:var(--rule);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:10px;color:var(--t3)}
.av img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%}
.bb{border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.eyebrow{font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--red);text-transform:uppercase}
.sec-t{font-weight:900;font-size:28px;font-stretch:70%;text-transform:uppercase;line-height:1}
.link{font-weight:600;font-size:14px;color:var(--blue);transition:color .15s}
.link:hover{color:var(--navy)}
.srch{height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border:2px solid var(--navy);border-radius:4px;box-shadow:4px 4px 0 var(--navy)}
.mag{width:13px;height:13px;border:2px solid var(--navy);border-radius:50%;flex:none}
.srch input{flex:1;min-width:0;background:transparent;border:none;outline:none;font-weight:500;font-size:17px}
.srch input::placeholder{color:var(--navy);opacity:.55}
.dd{position:absolute;left:0;right:0;background:#fff;border:2px solid var(--navy);border-radius:4px;z-index:30;display:none;max-height:380px;overflow-y:auto}
.dd-i{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s}
.dd-i:last-child{border-bottom:none}
.dd-i:hover,.dd-i.act{background:var(--surface)}
.dd-n{flex:1;font-weight:600;font-size:14px}
.dd-t{font-weight:500;font-size:11px;color:var(--t3)}
.dd-none{padding:12px;font-size:13px;color:var(--t3);line-height:1.4}
.btn{height:50px;display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;border-radius:4px;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:4px 4px 0 var(--red);transition:background .15s}
.btn:hover{background:var(--blue)}
.lgnd{display:flex;flex-direction:column;gap:8px}
.lgnd-t{font-weight:600;font-size:10px;letter-spacing:.08em;color:var(--t3)}
.lgnd-bar{height:8px;border-radius:4px;background:var(--grad)}
.lgnd-l{display:flex;justify-content:space-between;font-weight:500;font-size:10px;color:var(--t3)}

/* ---------- header ---------- */
.hdr{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 44px;height:60px;border-bottom:3px solid var(--navy)}
.hdr-l{display:flex;align-items:center;gap:36px}
.wm{font-weight:900;font-size:25px;font-stretch:75%;text-transform:uppercase;white-space:nowrap}
.wm span{color:var(--blue)}
.nav{display:flex;gap:26px;font-weight:600;font-size:14px;color:var(--t3)}
.nav a{transition:color .15s}
.nav a:hover{color:var(--blue)}
.nav a.on{color:var(--navy)}
.hdr-r{display:flex;align-items:center;gap:14px;font-weight:500;font-size:12px;color:var(--t3);text-transform:uppercase;white-space:nowrap}
.menu-btn{display:none;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--navy);border-radius:3px;padding:0 12px;min-height:36px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(360px,1fr) minmax(0,1000px);border-bottom:3px solid var(--navy)}
.hero-l{padding:36px 32px 32px 44px;display:flex;flex-direction:column;gap:22px;border-right:3px solid var(--navy)}
.hero-h{font-weight:900;font-size:60px;line-height:.9;font-stretch:66%;text-transform:uppercase;letter-spacing:-.01em}
.hero-p{font-size:16px;line-height:1.45;color:var(--t2);text-wrap:pretty}
.srch-wrap{position:relative;display:flex;flex-direction:column;gap:10px}
.srch-wrap .dd{top:62px}
.hero .lgnd{margin-top:auto;padding-top:16px;border-top:1px solid var(--navy)}

.stage{position:relative;height:540px;overflow:hidden;background:var(--surface)}
.court{position:absolute;left:50%;bottom:0;width:1000px;height:540px;transform:translateX(-50%);pointer-events:none}
.court-m{display:none}
.rafter{position:absolute;left:0;right:0;top:0;height:3px;background:var(--navy)}
.banners{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;padding:0 28px}
.bn{display:flex;flex-direction:column;cursor:pointer;transition:transform .15s ease;container-type:inline-size;min-width:0}
.bn:hover{transform:translateY(4px)}
.bn-wire{height:18px;margin:0 22%;border-left:2px solid var(--navy);border-right:2px solid var(--navy)}
.bn-body{position:relative;background:#5b6478;color:#fff;clip-path:polygon(0 0,100% 0,100% 100%,50% 90%,0 100%);display:flex;flex-direction:column;padding-bottom:34px}
.bn-col{position:absolute;inset:0}
.bn-body>*:not(.bn-col){position:relative}
.bn-s1{height:5px;background:var(--acc,#fff);margin-top:10px}
.bn-s2{height:2px;background:var(--acc,#fff);margin-top:3px}
.bn-cat{padding:14px 8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.bn-lab{font-weight:800;font-size:16px;line-height:1;font-stretch:72%;letter-spacing:.08em;text-transform:uppercase}
.bn-lab-s{display:none}
.bn-note{font-weight:500;font-size:9px;line-height:1;letter-spacing:.06em;opacity:.85;white-space:nowrap}
.bn-v{padding:0 6px;font-weight:900;font-size:min(66px,46cqi);line-height:.95;font-stretch:62%;letter-spacing:-.01em;text-align:center;white-space:nowrap}
.bn-ph{position:relative;height:112px;margin-top:8px;overflow:hidden;border-top:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:rgba(255,255,255,.5)}
.bn-ph .lg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:120%;opacity:.2}
.bn-ph .ini{position:relative}
.bn-ph .hs{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%}
.bn-name{background:#fff;color:var(--navy);border-top:4px solid var(--acc,#fff);padding:8px 10px 9px;display:flex;align-items:center;gap:8px;min-width:0}
.bn-name img{width:24px;height:24px;flex:none}
.bn-nmw{min-width:0;display:flex;flex-direction:column;gap:1px}
.bn-nm{font-weight:800;font-size:14px;font-stretch:78%;text-transform:uppercase}
.bn-tm{font-weight:500;font-size:10px;color:var(--t3)}
@container (max-width:112px){.bn-lab-f{display:none}.bn-lab-s{display:block}.bn-cat{padding-left:4px;padding-right:4px}}
.stage-cap{position:absolute;right:20px;bottom:14px;font-weight:600;font-size:10px;color:var(--t4);letter-spacing:.08em}

/* ---------- movers ---------- */
.movers{display:grid;grid-template-columns:minmax(0,1fr) 340px 340px;border-bottom:3px solid var(--navy)}
.lead{padding:28px 40px 32px 44px;display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--rule2)}
.lead-eb{font-weight:600;font-size:11px;letter-spacing:.1em;color:var(--red)}
.lead-h{font-weight:800;font-size:52px;line-height:.95;font-stretch:70%;letter-spacing:-.01em;text-wrap:balance;cursor:pointer}
.lead-h-s{display:none}
.lead-g{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:end}
.lead-ph{position:relative;height:164px;background:var(--surface);border:1px solid var(--navy);overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:30px;color:var(--t4);cursor:pointer}
.lead-ph img{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%}
.lead-r{display:flex;flex-direction:column;gap:14px;padding-bottom:4px;min-width:0}
.lead-meta{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.track{position:relative;height:40px;margin:0 18px}
.track-bar{position:absolute;left:-18px;right:-18px;top:16px;height:8px;border-radius:4px;background:var(--grad)}
.track-dash{position:absolute;top:20px;height:0;border-top:2px dashed var(--navy)}
.b-from{position:absolute;top:6px;transform:translateX(-50%);width:28px;height:28px;border:2px solid #fff;opacity:.6;font-weight:600;font-size:12px}
.b-to{position:absolute;top:2px;transform:translateX(-50%);width:36px;height:36px;border:2px solid var(--navy);font-weight:700;font-size:14px}
.lead-copy{font-size:17px;line-height:1.4;color:var(--t2);text-wrap:pretty}
.mv-col{padding:28px 24px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mv-col.rise{border-right:1px solid var(--rule2)}
.mv-col.fall{padding-right:44px}
.mv-hd{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--navy);padding-bottom:6px}
.mv-t{font-weight:600;font-size:26px}
.rise .mv-t{color:var(--rise)}.fall .mv-t{color:var(--fall)}
.mv-m{font-weight:500;font-size:10px;color:var(--t3);text-transform:uppercase}
.mv-row{display:grid;grid-template-columns:minmax(0,1fr) 22px 26px 34px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s}
.mv-row:hover{background:var(--surface)}
.mv-n{font-weight:600;font-size:16px}
.mv-s{font-weight:500;font-size:10px;color:var(--t3)}
.bb.f{width:22px;height:22px;opacity:.55;font-weight:600;font-size:10px}
.bb.t{width:26px;height:26px;font-weight:600;font-size:11px}
.mv-d{font-weight:600;font-size:13px;text-align:right}
.mv-d.up{color:var(--rise)}.mv-d.dn{color:var(--fall)}
.mv-mob{display:none}
.mv-empty{font-size:13px;color:var(--t3);padding:10px 0;line-height:1.4}

/* ---------- rotation board ---------- */
.rb{padding:26px 44px 36px;display:flex;flex-direction:column;gap:12px}
.rb-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rb-grid{display:grid;grid-template-columns:40px repeat(6,minmax(0,1fr))}
.rb-head{border-bottom:3px solid var(--navy);padding-bottom:6px}
.rb-rkh{font-weight:600;font-size:10px;color:var(--t3)}
.rb-ch{padding-left:12px;display:flex;flex-direction:column;min-width:0}
.rb-cl{font-weight:800;font-size:16px;font-stretch:72%;text-transform:uppercase}
.rb-cn{font-weight:500;font-size:9px;color:var(--t3)}
.rb-row{border-bottom:1px solid var(--rule)}
.rb-row.top{background:var(--tint)}
.rk{font-weight:900;font-size:26px;font-stretch:66%;color:var(--t4);display:flex;align-items:center}
.top .rk,.rk.one{color:var(--red)}
.rb-c{display:flex;align-items:center;gap:8px;padding:9px 8px 9px 12px;border-left:1px solid var(--rule);cursor:pointer;min-width:0;transition:background .15s}
.rb-c:hover{background:var(--surface)}
.rb-who{min-width:0;flex:1}
.rb-nm{font-weight:700;font-size:13px}
.rb-tm{font-weight:500;font-size:10px;color:var(--t3)}
.rb-v{font-weight:600;font-size:15px}
.rb-m{display:none}
.rb-m-l{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 12px;border-radius:3px;font-weight:700;font-size:13px;font-stretch:75%;border:1.5px solid var(--navy);transition:background .15s}
.chip.on{background:var(--blue);color:#fff}
.lrow{display:grid;grid-template-columns:22px 34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s}
.lrow:hover{background:var(--surface)}
.lrow .rk{font-size:20px}
.lrow-n{font-weight:700;font-size:15px}
.lrow-t{font-weight:500;font-size:11px;color:var(--t3)}
.lrow-v{font-weight:600;font-size:17px}

/* ---------- footer ---------- */
.ftr{padding:14px 44px;background:var(--navy);color:#bdb4a4;display:flex;justify-content:space-between;gap:12px;font-weight:500;font-size:12px;text-transform:uppercase}

/* ---------- inner pages ---------- */
.page{padding:28px 44px 48px}
.page-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:16px;border-bottom:3px solid var(--navy);margin-bottom:24px}
.page-top .sub{font-size:14px;color:var(--t3);margin-top:8px;line-height:1.4}
.mini-srch{position:relative;width:min(420px,100%)}
.mini-srch .srch{height:46px;box-shadow:3px 3px 0 var(--navy)}
.mini-srch .srch input{font-size:15px}
.mini-srch .dd{top:54px}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 32px}
.lb-card{display:flex;flex-direction:column;min-width:0}
.lb-hd{border-bottom:3px solid var(--navy);padding-bottom:6px;margin-bottom:2px}
.lb-l{font-weight:800;font-size:20px;font-stretch:72%;text-transform:uppercase}
.lb-n{font-weight:500;font-size:10px;color:var(--t3);text-transform:uppercase;min-height:12px}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px 28px}
.tm-hd{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--navy);padding:0 0 6px 10px;border-left:6px solid var(--navy)}
.tm-hd img{width:28px;height:28px}
.tm-n{font-weight:800;font-size:18px;font-stretch:72%;text-transform:uppercase}
.pl-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s}
.pl-row:hover{background:var(--surface)}
.pl-n{font-weight:700;font-size:14px}
.pl-s{font-weight:500;font-size:11px;color:var(--t3);white-space:nowrap}
.empty{padding:60px 0;text-align:center;color:var(--t3);font-size:15px;line-height:1.6}

/* ---------- player page ---------- */
.p-hdr{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:28px;align-items:end;padding-bottom:22px;border-bottom:3px solid var(--navy)}
.p-ph{position:relative;height:150px;border:1px solid var(--navy);overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:34px;color:rgba(255,255,255,.55)}
.p-ph .lg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:120%;opacity:.2}
.p-ph .ini{position:relative}
.p-ph .hs{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:100%}
.p-name{font-weight:900;font-size:58px;line-height:.9;font-stretch:66%;text-transform:uppercase;letter-spacing:-.01em;margin-top:8px}
.p-team{font-weight:700;font-size:15px;margin-top:10px}
.p-meta{font-weight:500;font-size:12px;color:var(--t3);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.p-logo{width:96px;height:96px;object-fit:contain}
.p-sec{padding:24px 0;border-bottom:3px solid var(--navy)}
.p-sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.p-sec-hd .sec-t{font-size:24px}
.p-sec-hd .note{font-size:12px;color:var(--t3)}
.st-wrap{overflow-x:auto}
.st{width:100%;border-collapse:collapse;min-width:620px}
.st th{font-weight:600;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:6px;text-align:center;border-bottom:2px solid var(--navy)}
.st td{padding:9px 6px;text-align:center;font-weight:600;font-size:15px;border-bottom:1px solid var(--rule)}
.st .lbl{text-align:left;font-weight:700;font-size:11px;color:var(--t3);white-space:nowrap}
.st td.elite{background:rgba(31,138,76,.12);color:var(--rise);font-weight:800}
.scale{display:flex;align-items:center;gap:12px;font-weight:600;font-size:10px;letter-spacing:.08em;color:var(--t3)}
.scale .lgnd-bar{width:120px}
.cat{margin-bottom:22px}
.cat:last-child{margin-bottom:0}
.cat-h{font-weight:800;font-size:16px;font-stretch:72%;letter-spacing:.06em;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid var(--navy)}
.sr{display:grid;grid-template-columns:170px minmax(0,1fr) 64px;align-items:center;gap:18px;padding:8px 0;border-bottom:1px solid var(--rule)}
.sr-lbl{font-weight:600;font-size:14px;color:var(--navy);position:relative;cursor:help}
.sr-lbl .sub{display:block;font-weight:500;font-size:10px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.sr-lbl .tt{display:none;position:absolute;bottom:calc(100% + 8px);left:0;background:var(--navy);color:#fff;padding:10px 12px;border-radius:4px;font-weight:400;font-size:12px;width:250px;line-height:1.45;z-index:40;box-shadow:3px 3px 0 var(--red)}
.sr-lbl:hover .tt{display:block}
.sr-bar{position:relative;height:22px;margin-right:16px}
.sr-trk{position:absolute;inset:0 -16px 0 0;background:var(--surface);border-radius:4px}
.sr-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.sr-circ{position:absolute;top:50%;width:32px;height:32px;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 0 1.5px var(--navy);font-weight:700;font-size:12px;transition:left .6s cubic-bezier(.22,1,.36,1);z-index:2}
.sr-na{font-size:12px;color:var(--t3);font-style:italic}
.sr-val{font-weight:600;font-size:16px;text-align:right}
.sc-court{display:flex;justify-content:center}
.sc-court canvas{width:100%;max-width:560px;height:auto;border:1px solid var(--navy);display:block}
.sc-leg{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin-top:12px;font-size:12px;color:var(--t2);font-weight:500}
.sc-leg .lgnd-bar{width:120px}
.sc-sz{color:var(--t3);width:100%;text-align:center;font-size:11px}
.p-foot{padding-top:16px;font-size:12px;color:var(--t3);line-height:1.6}

/* ---------- compare modal ---------- */
.cmp-modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(11,21,48,.55);align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto}
.cmp-modal.open{display:flex}
.cmp-panel{background:#fff;border:3px solid var(--navy);border-radius:4px;max-width:960px;width:100%;box-shadow:8px 8px 0 var(--red)}
.cmp-top{padding:16px 24px;border-bottom:3px solid var(--navy);display:flex;align-items:center;justify-content:space-between}
.cmp-x{width:44px;height:44px;border:2px solid var(--navy);border-radius:4px;font-size:22px;line-height:1;transition:background .15s}
.cmp-x:hover{background:var(--surface)}
.cmp-sr{padding:18px 24px;display:flex;gap:16px}
.cmp-sr .cs{flex:1;position:relative}

/* ---------- opening animation ("Tip-Off") ---------- */
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes outUp{to{transform:translateY(-100%)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drop{0%{transform:translateY(-330px) rotate(0)}55%{transform:translateY(8px) rotate(1.5deg)}75%{transform:translateY(-3px) rotate(-1deg)}90%{transform:translateY(1px) rotate(.4deg)}100%{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}

.intro-court{width:var(--cw);height:auto;display:block;overflow:visible;stroke-width:2.5}

.intro-box{background:var(--navy);padding:6px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) 1.9s both}
.intro-wm{font-weight:900;font-size:clamp(26px,calc(var(--cw) * .056),66px);line-height:.9;font-stretch:66%;text-transform:uppercase;color:#fff;white-space:nowrap}

html.intro .hdr::after,html.intro .hero-l::after,html.intro #movers::after,html.intro #rb::after,html.intro .ftr::after{content:'';position:absolute;inset:0;background:var(--surface);z-index:60;pointer-events:none;animation:fadeOut .4s ease 4.55s both}

@keyframes accIn{from{background-color:#fff;border-top-color:#fff}}

function fmt(v,s){
  var n=parseFloat(v);if(isNaN(n))return 'N/A';
  var f=s&&s.f,out;
  if(f==='pct')out=(n*100).toFixed(1);else if(f==='d2')out=n.toFixed(2);else out=n.toFixed(1);
  if(s&&s.sg&&n>0)out='+'+out;
  return out;
}
var poolCache={};
function pool(s){
  if(!poolCache[s.k])poolCache[s.k]=D.filter(function(p){return !s.q||s.q(p);}).map(function(p){return parseFloat(p[s.k]);}).filter(function(v){return !isNaN(v);});
  return poolCache[s.k];
}
/* 1-99, 'na' if not enough attempts, null if no value. Same formula as the Python updater. */
function pct(p,s){
  var n=parseFloat(p[s.k]);if(isNaN(n))return null;
  if(s.q&&!s.q(p))return 'na';
  var nums=pool(s);if(!nums.length)return null;
  var below=0,same=0;
  for(var i=0;i<nums.length;i++){var v=nums[i];if(v===n)same++;else if(s.h?v<n:v>n)below++;}
  return Math.max(1,Math.min(99,Math.round((below+same/2)/nums.length*100)));
}
function isNum(x){return typeof x==='number';}

function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function find(term,limit){
  var t=norm(term);if(!t)return [];
  return D.map(function(p){return {p:p,i:norm(p.Player).indexOf(t)};}).filter(function(x){return x.i>=0;})
    .sort(function(a,b){return a.i-b.i||a.p.Player.localeCompare(b.p.Player);}).slice(0,limit).map(function(x){return x.p;});
}
function wireSearch(input,dd,limit,onPick){
  var act=-1;
  function render(){
    var v=input.value;
    if(!v.trim()){dd.style.display='none';return;}
    var list=find(v,limit);act=-1;
    dd.innerHTML=list.length?list.map(function(p){
      return '<div class="dd-i" data-id="'+p.nba_id+'">'+av(p,28)+'<div class="dd-n ell">'+esc(p.Player)+'</div><div class="dd-t">'+esc(p.Team)+'</div></div>';
    }).join(''):'<div class="dd-none">No qualified player found. Players need more than '+META.pct+'% of games played.</div>';
    dd.style.display='block';
  }
  function hilite(){[].forEach.call(dd.querySelectorAll('.dd-i'),function(el,i){el.classList.toggle('act',i===act);});}
  input.addEventListener('input',render);
  input.addEventListener('focus',function(){if(input.value.trim())render();});
  input.addEventListener('keydown',function(e){
    var items=dd.querySelectorAll('.dd-i');
    if(e.key==='ArrowDown'&&items.length){act=Math.min(items.length-1,act+1);hilite();e.preventDefault();}
    else if(e.key==='ArrowUp'&&items.length){act=Math.max(0,act-1);hilite();e.preventDefault();}
    else if(e.key==='Enter'){var el=items[act>=0?act:0];if(el){dd.style.display='none';onPick(byId[el.dataset.id]);}}
    else if(e.key==='Escape'){dd.style.display='none';}
  });
  dd.addEventListener('click',function(e){var r=e.target.closest('[data-id]');if(r){dd.style.display='none';onPick(byId[r.dataset.id]);}});
  document.addEventListener('click',function(e){if(!e.target.closest('.srch')&&!dd.contains(e.target))dd.style.display='none';});
}

    +'<div style="min-width:0"><div class="eyebrow">'+esc(META.season)+' PERCENTILE CARD</div><div class="p-name">'+esc(p.Player)+'</div><div class="p-team" style="color:'+info.c+'">'+esc(info.n)+'</div><div class="p-meta">'+(p.Age?'Age '+p.Age+' · ':'')+p.G+' games</div></div>'
    +(lg?'<img class="p-logo" src="'+lg+'" data-hide="1" alt="">':'<div></div>')+'</div>';
  h+='<div class="p-sec"><div class="p-sec-hd"><div class="sec-t">Per Game &amp; Advanced</div><div class="note">Green = top 5% of qualified players</div></div><div class="st-wrap"><table class="st"><tr><th></th><th>GP</th><th>MPG</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TOV</th><th>FG%</th><th>3P%</th><th>FT%</th></tr><tr><td class="lbl">'+esc(META.season)+'</td><td>'+p.G+'</td>';
  ['MP_PG','PTS_PG','TRB_PG','AST_PG','STL_PG','BLK_PG','TOV_PG','FG%','3P%','FT%'].forEach(function(k){h+=tdCell(p,k,g(k));});
  h+='</tr></table><table class="st" style="margin-top:10px"><tr><th></th><th>eFG%</th><th>TS%</th><th>ORTG</th><th>DRTG</th><th>NET</th><th>USG%</th><th>AST%</th><th>+/-</th></tr><tr><td class="lbl">ADV</td>';
  ['eFG%','TS%','ORTG','DRTG','NET_RTG','USG%','AST%','PM'].forEach(function(k){h+=tdCell(p,k,g(k));});
  h+='</tr></table></div></div>';
  h+='<div class="p-sec"><div class="p-sec-hd"><div class="sec-t">Percentile Rankings</div><div class="scale"><span>1ST</span><span class="lgnd-bar"></span><span>99TH</span></div></div>';
  cats.forEach(function(cat){
    var rows='';
    cat.stats.forEach(function(s){
      var r=pct(p,s);if(r===null)return;
      var lbl='<div class="sr-lbl">'+s.n+(s.inv?'<span class="sub">Lower is better</span>':'')+'<span class="tt">'+s.d+'</span></div>';
      if(r==='na'){rows+='<div class="sr">'+lbl+'<div class="sr-na">Not enough attempts to rank</div><div class="sr-val">'+fmt(p[s.k],s)+'</div></div>';return;}
      var w=Math.max(r,3);
      rows+='<div class="sr">'+lbl+'<div class="sr-bar"><div class="sr-trk"></div><div class="sr-fill" style="width:'+w+'%;background:'+pc(r)+'"></div>'+bub(r,'sr-circ','left:'+w+'%')+'</div><div class="sr-val">'+fmt(p[s.k],s)+'</div></div>';
    });
    if(rows)h+='<div class="cat"><div class="cat-h">'+cat.name+'</div>'+rows+'</div>';
  });
  h+='</div><div class="p-sec" id="scSec" hidden><div class="p-sec-hd"><div class="sec-t">Shot Chart</div><div class="note" id="scInfo"></div></div><div id="scBox"></div></div>';
  h+='<div class="p-foot">Data via NBA.com · Updated '+esc(META.updated)+' · '+qualLine()+'</div>';
  $('vPlayer').innerHTML=h;
  wireSearch($('pQ'),$('pDD'),8,openPlayer);
  drawSC(p);
  document.title=p.Player+' | NBA Savant';
}

/* ================= SHOT CHART =================
   NBA shot coordinates: units of 1/10 foot, the rim is (0,0). The baseline is
   5.25 ft behind the rim (y=-52.5) and half court is 47 ft from the baseline (y=417.5). */
var BASE_Y=-52.5,HALF_Y=417.5;
function isThree(x,y){return (Math.abs(x)>=220&&y<=90)||Math.sqrt(x*x+y*y)>=237.5;}
function expected(x,y){
  var lg=META.lg;if(!lg)return 0.45;
  var b=Math.min(35,Math.floor(Math.sqrt(x*x+y*y)/10));
  return lg[isThree(x,y)?'3':'2'][b];
}
function drawSC(p){
  var sec=$('scSec'),box=$('scBox'),shots=SD[String(p.nba_id)];
  if(!shots||!shots.length){sec.hidden=true;return;}
  sec.hidden=false;
  var pad=14,W=500+pad*2,H=470+pad*2,dpr=Math.min(window.devicePixelRatio||1,3);
  box.innerHTML='<div class="sc-court"><canvas id="scCvs" width="'+Math.round(W*dpr)+'" height="'+Math.round(H*dpr)+'"></canvas></div>'
    +'<div class="sc-leg"><span>Worse than league average</span><span class="lgnd-bar"></span><span>Better than league average</span><span class="sc-sz">Compared with the league from the same distance. Bigger dot = more shots.</span></div>';
  var c=$('scCvs').getContext('2d');c.scale(dpr,dpr);
  var X=function(x){return pad+x+250;},Y=function(y){return pad+(HALF_Y-y);};
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  c.fillStyle='rgba(29,66,138,.07)';c.fillRect(X(-80),Y(137.5),160,Y(BASE_Y)-Y(137.5));
  var cell=14,grid={},made=0,threeMade=0,n=0;
  shots.forEach(function(s){
    var x=s[0],y=s[1];
    n++;made+=s[2];if(isThree(x,y))threeMade+=s[2];
    if(x<-250||x>250||y<BASE_Y||y>HALF_Y)return;
    var k=Math.floor((x+250)/cell)+','+Math.floor((y-BASE_Y)/cell),g=grid[k];
    if(!g)g=grid[k]={t:0,m:0,e:0,sx:0,sy:0};
    g.t++;g.m+=s[2];g.e+=expected(x,y);g.sx+=x;g.sy+=y;
  });
  var cells=Object.keys(grid).map(function(k){return grid[k];}).sort(function(a,b){return a.t-b.t;});
  var maxT=cells.length?cells[cells.length-1].t:1,K=5;
  cells.forEach(function(g){
    var e=g.e/g.t,adj=(g.m+K*e)/(g.t+K),diff=adj-e;
    var score=50+diff/0.18*50,f=Math.sqrt(g.t/maxT);
    c.globalAlpha=0.32+0.55*f;c.fillStyle=pc(score);
    c.beginPath();c.arc(X(g.sx/g.t),Y(g.sy/g.t),cell*(0.42+0.78*f),0,Math.PI*2);c.fill();
  });
  c.globalAlpha=1;
  c.strokeStyle='rgba(11,21,48,.45)';c.lineWidth=1.4;c.lineJoin='round';
  var line=function(pts){c.beginPath();pts.forEach(function(q,i){if(i)c.lineTo(X(q[0]),Y(q[1]));else c.moveTo(X(q[0]),Y(q[1]));});c.stroke();};
  var arc=function(cx,cy,r,a0,a1){var o=[],N=60;for(var i=0;i<=N;i++){var a=a0+(a1-a0)*i/N;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;};
  line([[-250,BASE_Y],[250,BASE_Y],[250,HALF_Y],[-250,HALF_Y],[-250,BASE_Y]]);
  line([[-80,BASE_Y],[-80,137.5],[80,137.5],[80,BASE_Y]]);
  line([[-60,BASE_Y],[-60,137.5]]);line([[60,BASE_Y],[60,137.5]]);
  line(arc(0,137.5,60,0,Math.PI));
  c.setLineDash([5,5]);line(arc(0,137.5,60,Math.PI,2*Math.PI));c.setLineDash([]);
  line([[40,-12.5],[40,0]].concat(arc(0,0,40,0,Math.PI)).concat([[-40,0],[-40,-12.5]]));
  var yc=Math.sqrt(237.5*237.5-220*220),aL=Math.atan2(yc,-220),aR=Math.atan2(yc,220);
  line([[-220,BASE_Y],[-220,yc]].concat(arc(0,0,237.5,aL,aR)).concat([[220,yc],[220,BASE_Y]]));
  line(arc(0,HALF_Y,60,Math.PI,2*Math.PI));line(arc(0,HALF_Y,20,Math.PI,2*Math.PI));
  c.lineWidth=2.6;c.strokeStyle='#0b1530';line([[-30,-12.5],[30,-12.5]]);
  c.lineWidth=1.4;line([[0,-12.5],[0,-7.5]]);
  c.strokeStyle='#c8102e';c.lineWidth=1.8;line(arc(0,0,7.5,0,2*Math.PI));
  var fg=made/n*100,efg=(made+0.5*threeMade)/n*100;
  $('scInfo').textContent=META.season+' regular season · '+n+' shots · '+fg.toFixed(1)+'% FG · '+efg.toFixed(1)+'% eFG';
}

/* ================= COMPARE ================= */
var cPk=[null,null];
function openCmp(){$('cmpModal').classList.add('open');document.body.style.overflow='hidden';setTimeout(function(){(cPk[0]?$('cB'):$('cA')).focus();},30);}
function closeCmp(){$('cmpModal').classList.remove('open');document.body.style.overflow='';}
$('cmpX').addEventListener('click',closeCmp);
$('cmpModal').addEventListener('click',function(e){if(e.target===this)closeCmp();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCmp();});
document.addEventListener('click',function(e){var b=e.target.closest('[data-cmp]');if(b){e.preventDefault();openCmp();}});
$('navCmp').addEventListener('click',function(e){e.preventDefault();$('nav').classList.remove('open');openCmp();});
[0,1].forEach(function(idx){
  var inp=$(idx?'cB':'cA');
  wireSearch(inp,$(idx?'ddB':'ddA'),8,function(p){cPk[idx]=p;inp.value=p.Player;if(cPk[0]&&cPk[1])renderCmp();else $(idx?'cA':'cB').focus();});
});
function cmpHead(p){
  var i=teamOf(p.Team);
  return '<div class="cmp-ph" data-id="'+p.nba_id+'"><div class="av" style="border:3px solid '+i.c+'">'+esc(ini(p.Player))+img(headSm(p.nba_id))+'</div><div class="cn">'+esc(p.Player)+'</div><div class="ct" style="color:'+i.c+'">'+esc(i.n)+'</div><div class="cm">'+(p.Age?'Age '+p.Age+' · ':'')+p.G+' GP</div></div>';
}
function cmpSide(side,r){
  if(!isNum(r))return '<div class="cx-t '+side+'"><div class="cx-bg"></div></div>';
  var w=Math.max(r,4),pos=side==='L'?'left:calc(100% - '+w+'%)':'left:'+w+'%';
  return '<div class="cx-t '+side+'"><div class="cx-bg"></div><div class="cx-f" style="width:'+w+'%;background:'+pc(r)+'"></div>'+bub(r,'cx-b',pos)+'</div>';
}
function cmpRow(a,b,s){
  var va=parseFloat(a[s.k]),vb=parseFloat(b[s.k]);
  if(isNaN(va)&&isNaN(vb))return '';
  var ra=pct(a,s),rb=pct(b,s),win=0;
  if(isNum(ra)&&isNum(rb)&&va!==vb)win=(s.h?va>vb:va<vb)?-1:1;
  var arrow=win===-1?'◀':win===1?'▶':(isNum(ra)&&isNum(rb)?'=':'');
  return '<div class="cx-row"><div class="cx-v'+(win===-1?' w':'')+'">'+fmt(a[s.k],s)+'</div>'+cmpSide('L',ra)
    +'<div class="cx-m"><div class="cx-n">'+s.n+'</div>'+(s.inv?'<div class="cx-s">Lower is better</div>':'')+'<div class="cx-a'+(arrow==='='?' eq':'')+'">'+arrow+'</div></div>'
    +cmpSide('R',rb)+'<div class="cx-v'+(win===1?' w':'')+'">'+fmt(b[s.k],s)+'</div></div>';
}
function renderCmp(){
  var a=cPk[0],b=cPk[1];if(!a||!b)return;
  var h='<div class="cmp-heads">'+cmpHead(a)+cmpHead(b)+'</div>';
  cats.forEach(function(cat){
    var rows=cat.stats.map(function(s){return cmpRow(a,b,s);}).join('');
    if(rows)h+='<div class="cx-cat">'+cat.name+'</div>'+rows;
  });
  $('cmpBody').innerHTML=h;
}
$('cmpBody').addEventListener('click',function(e){var r=e.target.closest('.cmp-ph[data-id]');if(r){closeCmp();openPlayer(byId[r.dataset.id]);}});

/* ================= ROUTING ================= */
var VIEWS={home:'vHome',leaders:'vLeaders',players:'vPlayers',player:'vPlayer'};
var built={};
function go(h){if(location.hash===h)route();else location.hash=h;}
function show(view){
  Object.keys(VIEWS).forEach(function(k){$(VIEWS[k]).hidden=k!==view;});
  [].forEach.call(document.querySelectorAll('.nav a'),function(a){a.classList.toggle('on',a.dataset.nav===view);});
  $('nav').classList.remove('open');$('menuBtn').setAttribute('aria-expanded','false');
}
function route(){
  var h=location.hash||'',m=/^#p(\d+)$/.exec(h);
  if(m&&byId[m[1]]){show('player');showPlayer(byId[m[1]]);}
  else if(h==='#/leaders'){if(!built.leaders){buildLeaders();built.leaders=1;}show('leaders');document.title='Leaderboards | NBA Savant';}
  else if(h==='#/players'){if(!built.players){buildPlayers();built.players=1;}show('players');document.title='Players | NBA Savant';}
  else{show('home');document.title='NBA Savant | Player Percentile Rankings';if(h==='#/compare')openCmp();}
  window.scrollTo(0,0);
}
document.addEventListener('click',function(e){
  var r=e.target.closest('[data-id]');
  if(!r||r.closest('.dd')||r.closest('#cmpModal'))return;
  openPlayer(byId[r.dataset.id]);
});
document.addEventListener('click',function(e){var c=e.target.closest('[data-cat]');if(c){mobCat=+c.dataset.cat;renderMob();}});
$('menuBtn').addEventListener('click',function(){var o=$('nav').classList.toggle('open');this.setAttribute('aria-expanded',o?'true':'false');});
window.addEventListener('hashchange',route);

/* ================= OPENING ANIMATION ================= */
function runIntro(){
  var root=document.documentElement,ov=$('introOv');
  if(!root.classList.contains('intro')){if(ov)ov.parentNode.removeChild(ov);return;}
  var done=false,elapsed=(performance.now()-(window.__introT0||0))/1000,EV=['click','keydown','wheel','touchstart'];
  function finish(){
    if(done)return;done=true;
    root.classList.remove('intro');            /* everything jumps to its final state */
    if(ov&&ov.parentNode)ov.parentNode.removeChild(ov);
    EV.forEach(function(e){window.removeEventListener(e,finish,true);});
    window.removeEventListener('scroll',finish);window.removeEventListener('hashchange',finish);
  }
  setTimeout(function(){if(ov)ov.style.pointerEvents='none';},Math.max(0,3.8-elapsed)*1000);
  setTimeout(finish,Math.max(0,5.8-elapsed)*1000);
  EV.forEach(function(e){window.addEventListener(e,finish,{capture:true,passive:true});});
  window.addEventListener('scroll',finish,{passive:true});window.addEventListener('hashchange',finish);
}

/* ================= START ================= */
$('hdrSeason').textContent=META.season;
$('hdrUpd').textContent=' · UPDATED '+String(META.updated).toUpperCase();
$('ftrDate').textContent='DATA THROUGH '+String(META.updated).toUpperCase();
buildHome();
if(D.length)wireSearch($('homeQ'),$('homeDD'),6,openPlayer);
route();
runIntro();
})();
</script>
