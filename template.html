<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#2d8bc9;--gold:#f0c430;--tx:#111;--tx2:#555;--tx3:#767c85;--bdr:#e5e7eb;--bg2:#f8f9fb}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;min-height:100vh;color:var(--tx);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.hdr{background:var(--blue);padding:10px 28px;display:flex;align-items:center;justify-content:space-between}
.hdr-logo{display:flex;align-items:center;gap:10px;cursor:pointer;text-decoration:none}
.hdr-logo svg{width:32px;height:32px}
.hdr-logo-t{font-weight:700;font-size:1.1em;color:#fff;letter-spacing:1px}
.hdr-logo-t b{color:var(--gold)}
.hdr-r{font-size:.7em;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:1.5px;text-transform:uppercase}
.search-wrap{max-width:760px;margin:28px auto 0;padding:0 24px}
.search-box{position:relative}
.search-box input{width:100%;padding:14px 16px 14px 44px;font-size:.92em;font-family:inherit;background:#fff;border:1px solid var(--bdr);border-radius:10px;color:var(--tx);transition:border .15s}
.search-box input::placeholder{color:#aaa}
.search-box input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(45,139,201,.1)}
.s-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#aaa;pointer-events:none}
.sug{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--bdr);border-radius:10px;max-height:380px;overflow-y:auto;z-index:1000;display:none;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.sug-i{padding:10px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .1s}
.sug-i+.sug-i{border-top:1px solid #f5f5f5}
.sug-i:hover,.sug-i.act{background:#f7f9fc}
.sug-hs{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;background:#eee;flex-shrink:0}
.sug-n{font-weight:600;font-size:.88em}
.sug-m{font-size:.75em;color:var(--tx3);margin-left:auto}
.sug-none{padding:14px 16px;font-size:.85em;color:var(--tx3)}
.cmp-bar-area{max-width:760px;margin:10px auto 0;padding:0 24px;display:flex;align-items:center;gap:10px}
.cmp-btn{padding:7px 16px;border:1px solid var(--bdr);border-radius:8px;background:#fff;font:500 .82em/1 'Inter',sans-serif;color:var(--blue);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.cmp-btn:hover{background:var(--bg2);border-color:var(--blue)}
.cmp-btn svg{width:16px;height:16px}
.wrap{max-width:760px;margin:0 auto;padding:0 24px 60px}

/* ---------- Compare modal ---------- */
.cmp-modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.4);align-items:flex-start;justify-content:center;padding:32px 12px;overflow-y:auto}
.cmp-modal.open{display:flex}
.cmp-panel{background:#fff;border-radius:16px;max-width:920px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.15)}
.cmp-top{padding:18px 24px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.cmp-top h2{font-size:1.1em;font-weight:700}
.cmp-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg2);cursor:pointer;font-size:1.2em;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.cmp-close:hover{background:#eee}
.cmp-sr{padding:16px 24px;display:flex;gap:12px}
.cmp-sr .cs{flex:1;position:relative}
.cmp-sr input{width:100%;padding:10px 14px;font:.88em 'Inter',sans-serif;border:1px solid var(--bdr);border-radius:8px}
.cmp-sr input:focus{outline:none;border-color:var(--blue)}
.cdd{position:absolute;top:calc(100% + 2px);left:0;right:0;background:#fff;border:1px solid var(--bdr);border-radius:8px;max-height:240px;overflow-y:auto;z-index:10;display:none;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.cdd .sug-i{padding:8px 12px;gap:8px}
.cdd .sug-hs{width:28px;height:28px}
.cdd .sug-n{font-size:.82em}
.cmp-body{padding:0 20px 24px;--vw:48px;--lw:112px}
.cmp-empty{text-align:center;padding:48px 16px;color:var(--tx3);font-size:.9em}
.cmp-heads{display:grid;grid-template-columns:1fr 1fr;margin-bottom:6px}
.cmp-ph{text-align:center;padding:16px 8px 14px;border-bottom:1px solid var(--bdr)}
.cmp-ph img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:top;margin:0 auto 8px;display:block;background:#eee;border:3px solid #ddd}
.cmp-ph .cn{font-size:1em;font-weight:700}
.cmp-ph .ct{font-size:.75em;font-weight:600;margin-top:2px}
.cmp-ph .cm{font-size:.7em;color:var(--tx3);margin-top:1px}
.cx-cat{padding:16px 0 6px;font-size:.68em;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--blue);text-align:center;border-bottom:2px solid var(--bdr)}
.cx-row{display:grid;grid-template-columns:var(--vw) minmax(0,1fr) var(--lw) minmax(0,1fr) var(--vw);align-items:center;padding:6px 0;border-bottom:1px solid #f3f4f6}
.cx-v{font-size:.84em;font-weight:700;color:var(--tx3);white-space:nowrap}
.cx-v.w{color:var(--tx)}
.cx-v:first-child{text-align:left}
.cx-v:last-child{text-align:right}
.cx-t{position:relative;height:22px}
.cx-t.L{margin-left:14px}
.cx-t.R{margin-right:14px}
.cx-bg{position:absolute;inset:0;background:#eef1f5;border-radius:4px}
.cx-f{position:absolute;top:0;bottom:0;border-radius:4px;transition:width .5s ease}
.cx-t.L .cx-f{right:0}
.cx-t.R .cx-f{left:0}
.cx-b{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.64em;font-weight:700;color:#fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.25);text-shadow:0 1px 3px rgba(0,0,0,.45);z-index:2}
.cx-m{text-align:center;padding:0 6px;line-height:1.2}
.cx-n{font-size:.74em;font-weight:600;color:var(--tx2)}
.cx-s{font-size:.58em;color:var(--tx3);margin-top:1px}
.cx-a{font-size:.6em;font-weight:800;color:var(--blue);margin-top:2px;min-height:1em}
.cx-a.eq{color:#aaa}

/* ---------- Home ---------- */
#homePage{max-width:960px;margin:0 auto;padding:0 24px 60px}
.hero{padding:44px 0 12px;text-align:center}
.hero h1{font-size:2em;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.hero h1 b{color:var(--blue)}
.hero p{color:var(--tx3);font-size:.9em;margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto;line-height:1.5}
.hero .hero-meta{font-size:.78em;margin-top:6px}
.section-hd{display:flex;align-items:baseline;gap:8px;margin:28px 0 12px}
.section-hd h2{font-size:1.05em;font-weight:700}
.section-hd .badge{font-size:.6em;font-weight:700;background:var(--blue);color:#fff;padding:3px 8px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
.lb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.lb-card{border:1px solid var(--bdr);border-radius:12px;overflow:hidden;transition:box-shadow .15s}
.lb-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.06)}
.lb-hd{font-size:.7em;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--blue);padding:14px 16px 2px;display:flex;align-items:center;gap:6px}
.lb-hd .lb-icon{font-size:1.2em}
.lb-note{font-size:.62em;color:var(--tx3);padding:0 16px 6px;min-height:1.6em}
.lb-row{display:flex;align-items:center;gap:8px;padding:6px 16px;cursor:pointer;transition:background .1s}
.lb-row:hover{background:#f7f9fc}
.lb-rk{font-size:.72em;font-weight:700;color:var(--tx3);width:16px;text-align:center;flex-shrink:0}
.lb-rk.g{color:#d4a017;font-weight:800}
.lb-hs{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:top;background:#eee;flex-shrink:0}
.lb-tm-logo{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.lb-inf{flex:1;min-width:0}
.lb-nm{font-size:.8em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-tm{font-size:.65em;color:var(--tx3);font-weight:500}
.lb-v{font-size:.85em;font-weight:700;flex-shrink:0}
.lb-d{height:1px;background:#f3f4f6;margin:0 16px}
.lb-card .lb-row:last-child{padding-bottom:12px}
.empty-msg{text-align:center;padding:80px 20px;color:var(--tx3);font-size:.95em;line-height:1.6}

/* ---------- Player card ---------- */
.card{display:none;border:1px solid var(--bdr);border-radius:14px;overflow:hidden;background:#fff}
.p-hdr{position:relative;overflow:hidden}
.p-hdr-bg{position:absolute;inset:0;opacity:.1;pointer-events:none}
.p-hdr-in{position:relative;display:flex;align-items:center;padding:24px 28px;gap:20px;z-index:1}
.p-hs{width:88px;height:88px;border-radius:50%;object-fit:cover;object-position:top;background:var(--bg2);display:block;flex-shrink:0}
.p-hs.logo-fb{object-fit:contain;padding:12px}
.p-inf{flex:1;min-width:0}
.p-name{font-size:1.55em;font-weight:700;line-height:1.15;letter-spacing:-.02em;color:#111}
.p-tn{font-size:.85em;font-weight:600;margin-top:3px}
.p-meta{font-size:.76em;font-weight:400;color:var(--tx3);margin-top:2px}
.p-tl{flex-shrink:0;max-height:88px;max-width:88px;object-fit:contain}
.st-wrap{padding:20px 28px;border-bottom:1px solid var(--bdr)}
.st-title{font-size:.65em;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.st{width:100%;border-collapse:collapse;font-size:.78em}
.st th{font-weight:600;color:var(--tx3);font-size:.8em;text-transform:uppercase;letter-spacing:.3px;padding:4px 6px;text-align:center;border-bottom:1px solid var(--bdr)}
.st td{padding:6px;text-align:center;font-weight:600}
.st .lbl{text-align:left;font-weight:700;color:var(--tx3);font-size:.85em;width:56px;white-space:nowrap}
.st td.elite{background:rgba(57,255,20,.14);color:#0d6e0d;font-weight:700;border-radius:4px}
.pct-hdr{padding:24px 28px 0;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
.pct-yr{font-weight:700;font-size:.95em;color:var(--blue)}
.pct-t{font-weight:600;font-size:.95em}
.pct-sub{font-weight:400;font-size:.78em;color:var(--tx3);margin-left:4px}
.pct-body{padding:8px 28px 32px}
.scale{display:flex;align-items:center;justify-content:flex-end;padding:8px 0 18px;gap:24px}
.sc-l{font-size:.65em;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.sc-l.bad{color:#e53e3e}.sc-l.ok{color:#999}.sc-l.good{color:#16a34a}
.sc-dot{color:#ddd;font-size:.4em}
.cat{margin-bottom:24px}
.cat-h{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--bdr);margin-bottom:4px}
.cat-icon{font-size:.85em}
.cat-name{font-weight:700;font-size:.85em;letter-spacing:.3px}
.sr{display:grid;grid-template-columns:145px 1fr 52px;align-items:center;padding:8px 0;gap:16px}
.sr+.sr{border-top:1px solid #f0f1f3}
.sr-lbl{font-size:.82em;font-weight:500;color:var(--tx2);text-align:left;cursor:help;position:relative;line-height:1.3}
.sr-lbl .sub{display:block;font-size:.78em;font-weight:400;color:var(--tx3);margin-top:1px}
.sr-lbl .tt{display:none;position:absolute;bottom:calc(100% + 8px);left:0;background:#1e293b;color:#f1f5f9;padding:10px 14px;border-radius:8px;font-size:.82em;font-weight:400;white-space:normal;width:260px;line-height:1.5;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none}
.sr-lbl .tt::after{content:'';position:absolute;top:100%;left:24px;border:6px solid transparent;border-top-color:#1e293b}
.sr-lbl:hover .tt{display:block}
.sr-bar{position:relative;height:26px;border-radius:5px;background:#eef1f5;overflow:visible}
.sr-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.sr-circ{position:absolute;top:50%;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72em;font-weight:700;color:#fff;transform:translate(-50%,-50%);transition:left .6s cubic-bezier(.22,1,.36,1);z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.2);text-shadow:0 1px 3px rgba(0,0,0,.4)}
.sr-na{font-size:.76em;color:var(--tx3);font-style:italic}
.sr-val{font-size:.92em;font-weight:700;text-align:right;color:var(--tx)}
.card-ft{padding:14px 28px;border-top:1px solid var(--bdr);font-size:.68em;color:var(--tx3);text-align:center;line-height:1.6}

/* ---------- Shot chart ---------- */
.sc-sec{padding:24px 28px;border-top:1px solid var(--bdr)}
.sc-hdr{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-bottom:14px}
.sc-hdr h3{font-size:.9em;font-weight:700}
.sc-hdr span{font-size:.74em;color:var(--tx3)}
.sc-court{display:flex;justify-content:center}
.sc-court canvas{width:100%;max-width:528px;height:auto;border:1px solid var(--bdr);border-radius:10px;display:block}
.sc-leg{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin-top:12px;font-size:.72em;color:var(--tx2);font-weight:500}
.sc-grad{width:120px;height:10px;border-radius:5px;background:linear-gradient(90deg,#ff0000,#ff8c00,#ffc800,#8cf000,#39ff14)}
.sc-sz{color:var(--tx3);width:100%;text-align:center}

@media(max-width:700px){
.hdr{padding:10px 16px}
.search-wrap,.cmp-bar-area{padding:0 16px}
#homePage{padding:0 16px 48px}
.wrap{padding:0 12px 48px}
.p-hdr-in{padding:18px 16px;gap:12px}
.p-hs{width:64px;height:64px}
.p-hs.logo-fb{padding:8px}
.p-tl{max-height:56px;max-width:56px}
.p-name{font-size:1.2em}
.st-wrap{padding:14px;overflow-x:auto}
.pct-hdr{padding:18px 14px 0}
.pct-body{padding:6px 14px 20px}
.sr{grid-template-columns:105px 1fr 42px;gap:8px}
.sr-lbl .tt{width:180px;font-size:.72em}
.sr-circ{width:24px;height:24px;font-size:.6em}
.sr-bar{height:22px}
.lb-grid{grid-template-columns:1fr}
.cmp-modal{padding:0}
.cmp-panel{border-radius:0;min-height:100vh}
.cmp-top{padding:14px 16px}
.cmp-sr{flex-direction:column;padding:12px 16px}
.cmp-body{padding:0 10px 24px;--vw:36px;--lw:78px}
.cmp-ph img{width:56px;height:56px}
.cmp-ph .cn{font-size:.88em}
.cx-t{height:20px}
.cx-t.L{margin-left:11px}
.cx-t.R{margin-right:11px}
.cx-b{width:22px;height:22px;font-size:.56em}
.cx-v{font-size:.74em}
.cx-m{padding:0 3px}
.cx-n{font-size:.66em}
.hero h1{font-size:1.5em}
.sc-sec{padding:16px 14px}
.card-ft{padding:14px}
}
</style>
</head>

/* ================= COLORS ================= */
function sL(c){return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function Ls(c){return c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;}
var STOPS=[{p:0,r:255,g:0,b:0},{p:15,r:255,g:60,b:0},{p:30,r:255,g:140,b:0},{p:45,r:255,g:200,b:0},{p:55,r:210,g:225,b:0},{p:70,r:140,g:240,b:0},{p:85,r:80,g:250,b:10},{p:100,r:57,g:255,b:20}];
/* 0 (red) to 100 (green), blended in linear light so the middle doesn't look muddy */
function scale(p){
  p=Math.max(0,Math.min(100,p));
  var a=STOPS[0],b=STOPS[STOPS.length-1];
  for(var i=0;i<STOPS.length-1;i++){if(p>=STOPS[i].p&&p<=STOPS[i+1].p){a=STOPS[i];b=STOPS[i+1];break;}}
  var t=(p-a.p)/(b.p-a.p||1);
  function mix(x,y){return Math.round(Ls(sL(x/255)+(sL(y/255)-sL(x/255))*t)*255);}
  return 'rgb('+mix(a.r,b.r)+','+mix(a.g,b.g)+','+mix(a.b,b.b)+')';
}
function grad(p){return 'linear-gradient(90deg,'+scale(Math.max(p-15,0))+','+scale(p)+')';}

function fmt(v,s){
  var n=parseFloat(v);if(isNaN(n))return 'N/A';
  var f=s&&s.f,out;
  if(f==='pct')out=(n*100).toFixed(1);else if(f==='d2')out=n.toFixed(2);else out=n.toFixed(1);
  if(s&&s.sg&&n>0)out='+'+out;
  return out;
}

/* Percentile among players who qualify for that stat. Returns a number 1-99,
   'na' if this player doesn't have enough attempts, or null if there is no value. */
var poolCache={};
function pool(s){
  if(!poolCache[s.k]){
    poolCache[s.k]=D.filter(function(p){return !s.q||s.q(p);}).map(function(p){return parseFloat(p[s.k]);}).filter(function(v){return !isNaN(v);});
  }
  return poolCache[s.k];
}
function pct(p,s){
  var n=parseFloat(p[s.k]);if(isNaN(n))return null;
  if(s.q&&!s.q(p))return 'na';
  var nums=pool(s);if(!nums.length)return null;
  var below=0,same=0;
  for(var i=0;i<nums.length;i++){var v=nums[i];if(v===n)same++;else if(s.h?v<n:v>n)below++;}
  return Math.max(1,Math.min(99,Math.round((below+same/2)/nums.length*100)));
}
function isNum(x){return typeof x==='number';}

function norm(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();}
function find(term,limit){
  var t=norm(term);if(!t)return [];
  return D.map(function(p){return {p:p,i:norm(p.Player).indexOf(t)};})
    .filter(function(x){return x.i>=0;})
    .sort(function(a,b){return a.i-b.i||a.p.Player.localeCompare(b.p.Player);})
    .slice(0,limit).map(function(x){return x.p;});
}
function sugHtml(list,meta){

/* ================= SHOT CHART =================
   NBA shot coordinates: units of 1/10 foot, the rim is (0,0), x runs sideline to
   sideline (-250..250), y runs away from the basket. The baseline is 5.25 ft behind
   the rim (y=-52.5) and half court is 47 ft from the baseline (y=417.5). */
var BASE_Y=-52.5,HALF_Y=417.5;
function isThree(x,y){return (Math.abs(x)>=220&&y<=90)||Math.sqrt(x*x+y*y)>=237.5;}
function expected(x,y){
  var lg=META.lg;if(!lg)return 0.45;
  var b=Math.min(35,Math.floor(Math.sqrt(x*x+y*y)/10));
  return lg[isThree(x,y)?'3':'2'][b];
}
function drawSC(p){
  var sec=$('scSec'),box=$('scBox'),shots=SD[String(p.nba_id)];
  if(!shots||!shots.length){sec.style.display='none';return;}
  sec.style.display='block';
  var pad=14,W=500+pad*2,H=470+pad*2,dpr=Math.min(window.devicePixelRatio||1,3);
  box.innerHTML='<div class="sc-court"><canvas id="scCvs" width="'+Math.round(W*dpr)+'" height="'+Math.round(H*dpr)+'"></canvas></div>'
    +'<div class="sc-leg"><span>Worse than league average</span><span class="sc-grad"></span><span>Better than league average</span><span class="sc-sz">Compared with the league at the same distance. Bigger dot = more shots.</span></div>';
  var c=$('scCvs').getContext('2d');c.scale(dpr,dpr);
  var X=function(x){return pad+x+250;},Y=function(y){return pad+(HALF_Y-y);};

  /* floor + painted lane */
  c.fillStyle='#fbfbf9';c.fillRect(0,0,W,H);
  c.fillStyle='#f3f1ea';c.fillRect(X(-80),Y(137.5),160,Y(BASE_Y)-Y(137.5));

  /* heat dots: group shots into 1.4 ft squares, color by makes vs. what the league makes from there */
  var cell=14,grid={},made=0,threes=0,threeMade=0,n=0;
  shots.forEach(function(s){
    var x=s[0],y=s[1];
    n++;made+=s[2];if(isThree(x,y)){threes++;threeMade+=s[2];}
    if(x<-250||x>250||y<BASE_Y||y>HALF_Y)return;
    var k=Math.floor((x+250)/cell)+','+Math.floor((y-BASE_Y)/cell),g=grid[k];
    if(!g)g=grid[k]={t:0,m:0,e:0,sx:0,sy:0};
    g.t++;g.m+=s[2];g.e+=expected(x,y);g.sx+=x;g.sy+=y;
  });
  var cells=Object.keys(grid).map(function(k){return grid[k];}).sort(function(a,b){return a.t-b.t;});
  var maxT=cells.length?cells[cells.length-1].t:1,K=5;
  cells.forEach(function(g){
    var e=g.e/g.t,adj=(g.m+K*e)/(g.t+K),diff=adj-e;   /* small samples are pulled toward average */
    var score=50+diff/0.18*50,f=Math.sqrt(g.t/maxT);
    c.globalAlpha=0.32+0.55*f;c.fillStyle=scale(score);
    c.beginPath();c.arc(X(g.sx/g.t),Y(g.sy/g.t),cell*(0.42+0.78*f),0,Math.PI*2);c.fill();
  });
  c.globalAlpha=1;

  /* court lines */
  c.strokeStyle='#9aa3ad';c.lineWidth=1.4;c.lineJoin='round';
  var line=function(pts){c.beginPath();pts.forEach(function(q,i){if(i)c.lineTo(X(q[0]),Y(q[1]));else c.moveTo(X(q[0]),Y(q[1]));});c.stroke();};
  var arc=function(cx,cy,r,a0,a1){var o=[],N=60;for(var i=0;i<=N;i++){var a=a0+(a1-a0)*i/N;o.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return o;};
  line([[-250,BASE_Y],[250,BASE_Y],[250,HALF_Y],[-250,HALF_Y],[-250,BASE_Y]]);          /* sidelines */
  line([[-80,BASE_Y],[-80,137.5],[80,137.5],[80,BASE_Y]]);                               /* lane, 16 ft wide, free throw line 19 ft from baseline */
  line([[-60,BASE_Y],[-60,137.5]]);line([[60,BASE_Y],[60,137.5]]);                       /* inner lane marks */
  line(arc(0,137.5,60,0,Math.PI));                                                       /* free throw circle, top half */
  c.setLineDash([5,5]);line(arc(0,137.5,60,Math.PI,2*Math.PI));c.setLineDash([]);        /* bottom half dashed */
  line([[40,-12.5],[40,0]].concat(arc(0,0,40,0,Math.PI)).concat([[-40,0],[-40,-12.5]])); /* restricted area, 4 ft */
  var yc=Math.sqrt(237.5*237.5-220*220),aL=Math.atan2(yc,-220),aR=Math.atan2(yc,220);
  line([[-220,BASE_Y],[-220,yc]].concat(arc(0,0,237.5,aL,aR)).concat([[220,yc],[220,BASE_Y]])); /* three point line */
  line(arc(0,HALF_Y,60,Math.PI,2*Math.PI));line(arc(0,HALF_Y,20,Math.PI,2*Math.PI));     /* center circle */
  c.lineWidth=2.6;c.strokeStyle='#707a85';line([[-30,-12.5],[30,-12.5]]);               /* backboard */
  c.lineWidth=1.4;line([[0,-12.5],[0,-7.5]]);
  c.strokeStyle='#e0652b';c.lineWidth=1.8;line(arc(0,0,7.5,0,2*Math.PI));               /* rim */

  var fg=made/n*100,efg=(made+0.5*threeMade)/n*100;
  $('scInfo').textContent=META.season+' Regular Season · '+n+' shots · '+fg.toFixed(1)+'% FG · '+efg.toFixed(1)+'% eFG';
}

/* ================= COMPARE ================= */
var cPk=[null,null];
function openCmp(){$('cmpModal').classList.add('open');document.body.style.overflow='hidden';}
function closeCmp(){$('cmpModal').classList.remove('open');document.body.style.overflow='';}
$('openCmp').addEventListener('click',openCmp);
$('closeCmp').addEventListener('click',closeCmp);
$('cmpModal').addEventListener('click',function(e){if(e.target===this)closeCmp();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCmp();});
[0,1].forEach(function(idx){
  var inp=$(idx?'cB':'cA'),dd=$(idx?'ddB':'ddA');
  inp.addEventListener('input',function(){
    if(!this.value.trim()){dd.style.display='none';return;}
    dd.innerHTML=sugHtml(find(this.value,8),false);dd.style.display='block';
  });
  dd.addEventListener('click',function(e){
    var r=e.target.closest('[data-id]');if(!r)return;
    var p=byId[r.dataset.id];cPk[idx]=p;inp.value=p.Player;dd.style.display='none';
    if(cPk[0]&&cPk[1])renderCmp();
  });
});
function cmpHead(p){
  var i=teamOf(p.Team);
  return '<div class="cmp-ph"><img src="'+headUrl(p.nba_id)+'" data-color="'+i.c+'" style="border-color:'+i.c+'" alt=""><div class="cn">'+esc(p.Player)+'</div><div class="ct" style="color:'+i.c+'">'+esc(i.n)+'</div><div class="cm">'+(p.Age?'Age '+p.Age+' · ':'')+p.G+' GP</div></div>';
}
function cmpSide(side,r){
  /* side: 'L' bars grow leftward from the center, 'R' grow rightward. Bubble sits on the bar end. */
  if(!isNum(r))return '<div class="cx-t '+side+'"><div class="cx-bg"></div></div>';
  var w=Math.max(r,5);
  var pos=side==='L'?'left:calc(100% - '+w+'%)':'left:'+w+'%';
  return '<div class="cx-t '+side+'"><div class="cx-bg"></div><div class="cx-f" style="width:'+w+'%;background:'+grad(r)+'"></div><div class="cx-b" style="'+pos+';background:'+scale(r)+'">'+r+'</div></div>';
}
function cmpRow(a,b,s){
  var va=parseFloat(a[s.k]),vb=parseFloat(b[s.k]);
  if(isNaN(va)&&isNaN(vb))return '';
  var ra=pct(a,s),rb=pct(b,s),win=0;
  if(isNum(ra)&&isNum(rb)&&va!==vb)win=(s.h?va>vb:va<vb)?-1:1;     /* -1 left wins, 1 right wins */
  var arrow=win===-1?'◀':win===1?'▶':(isNum(ra)&&isNum(rb)?'=':'');
  return '<div class="cx-row">'
    +'<div class="cx-v'+(win===-1?' w':'')+'">'+fmt(a[s.k],s)+'</div>'
    +cmpSide('L',ra)
    +'<div class="cx-m"><div class="cx-n">'+s.n+'</div>'+(s.inv?'<div class="cx-s">Lower is better</div>':'')+'<div class="cx-a'+(arrow==='='?' eq':'')+'">'+arrow+'</div></div>'
    +cmpSide('R',rb)
    +'<div class="cx-v'+(win===1?' w':'')+'">'+fmt(b[s.k],s)+'</div>'
    +'</div>';
}
function renderCmp(){
  var a=cPk[0],b=cPk[1];if(!a||!b)return;
  var h='<div class="cmp-heads">'+cmpHead(a)+cmpHead(b)+'</div>';
  cats.forEach(function(cat){
    var rows=cat.stats.map(function(s){return cmpRow(a,b,s);}).join('');
    if(rows)h+='<div class="cx-cat">'+cat.icon+' '+cat.name+'</div>'+rows;
  });
  $('cmpBody').innerHTML=h;
}

/* ================= START ================= */
$('playerCount').textContent=D.length?D.length+' qualified players':'';
buildHome();
var m=/^#p(\d+)$/.exec(location.hash||'');
if(m&&byId[m[1]])showPlayer(byId[m[1]]);
})();
</script>
