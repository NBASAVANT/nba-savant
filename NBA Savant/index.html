<style>
:root{--bg:#f4f4f4;--text:#1a1a1a;--text-sec:#555;--text-dim:#999;--bar-track:#d0d8e0;--brand-blue:#2d8bc9;--brand-gold:#f0c430}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Roboto',sans-serif;background:var(--bg);min-height:100vh;color:var(--text)}
.site-header{background:var(--brand-blue);padding:8px 24px;display:flex;align-items:center;justify-content:space-between}
.site-logo{display:flex;align-items:center;gap:10px}
.site-logo svg{width:36px;height:36px}
.site-logo-text{font-family:'Roboto Condensed',sans-serif;font-weight:900;font-size:1.25em;color:white;letter-spacing:1.5px}
.site-logo-text span{color:var(--brand-gold)}
.header-right{display:flex;align-items:center;gap:14px}
.season-label{font-family:'Roboto Condensed',sans-serif;font-size:.75em;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:1.5px}
.search-area{max-width:900px;margin:20px auto 0;padding:0 20px}
.search-box{position:relative}
.search-box input{width:100%;padding:12px 16px 12px 42px;font-size:.95em;font-family:'Roboto',sans-serif;background:white;border:2px solid #ccc;border-radius:6px;color:var(--text)}
.search-box input::placeholder{color:#bbb}
.search-box input:focus{outline:none;border-color:var(--brand-blue)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#bbb;pointer-events:none}
.suggestions{position:absolute;top:calc(100% + 2px);left:0;right:0;background:white;border:1px solid #ccc;border-radius:6px;max-height:360px;overflow-y:auto;z-index:1000;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.sug-item{padding:8px 14px;cursor:pointer;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:10px}
.sug-item:last-child{border-bottom:none}
.sug-item:hover{background:#f0f6ff}
.sug-headshot{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#e0e0e0;flex-shrink:0}
.sug-team-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Roboto Condensed',sans-serif;font-size:.5em;font-weight:800;color:white;flex-shrink:0;overflow:hidden}
.sug-team-badge img{width:100%;height:100%;object-fit:contain}
.sug-name{font-weight:600;font-size:.9em}
.sug-meta{font-size:.78em;color:var(--text-dim);margin-left:auto;font-family:'Roboto Condensed',sans-serif}
.filter-bar{max-width:900px;margin:10px auto 14px;padding:0 20px;display:flex;align-items:center;gap:10px;font-size:.82em;color:var(--text-sec)}
.filter-bar label{font-weight:500}
.filter-bar select{padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-family:'Roboto',sans-serif;background:white}
.player-count{margin-left:auto;font-family:'Roboto Condensed',sans-serif;color:var(--text-dim);font-size:.9em}
.container{max-width:900px;margin:0 auto;padding:0 20px 40px}
.player-card{display:none;background:white;border:1px solid #ccc;border-radius:6px;overflow:hidden}
.player-header{display:flex;align-items:stretch;border-bottom:2px solid var(--brand-blue)}
.player-id-area{width:220px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;position:relative;overflow:hidden;border-right:1px solid #ddd}
.player-id-bg{position:absolute;inset:0}
.player-headshot{position:relative;z-index:1;width:110px;height:80px;object-fit:cover;object-position:top;border-radius:6px;background:#e8e8e8}
.headshot-fallback{position:relative;z-index:1;display:none;flex-direction:column;align-items:center}
.team-logo-wrap{width:70px;height:70px;display:flex;align-items:center;justify-content:center}
.team-logo-wrap img{max-width:70px;max-height:70px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15))}
.team-badge-fb{width:65px;height:65px;border-radius:50%;display:none;align-items:center;justify-content:center;font-family:'Roboto Condensed',sans-serif;font-weight:900;font-size:1.2em;color:white;letter-spacing:1px;border:3px solid rgba(255,255,255,.3)}
.player-name-block{position:relative;z-index:1;text-align:center;margin-top:8px}
.p-name{font-family:'Roboto Condensed',sans-serif;font-size:1.3em;font-weight:800;line-height:1.1}
.p-team{font-family:'Roboto Condensed',sans-serif;font-size:.8em;font-weight:700;margin-top:3px}
.p-meta{font-size:.73em;color:var(--text-sec);margin-top:2px}
.stats-area{flex:1;padding:14px 18px;display:flex;flex-direction:column;justify-content:center;overflow-x:auto}
.stats-area-title{font-family:'Roboto Condensed',sans-serif;font-size:.7em;font-weight:700;color:var(--brand-blue);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
table.st{width:100%;border-collapse:collapse;font-family:'Roboto Condensed',sans-serif;font-size:.82em}
table.st th{font-weight:700;color:#888;font-size:.82em;text-transform:uppercase;letter-spacing:.3px;padding:3px 5px;text-align:center;border-bottom:1px solid #ddd}
table.st td{padding:5px;text-align:center;font-weight:600;font-size:.95em}
table.st .lbl{text-align:left;font-weight:800;color:#777;font-size:.85em}
table.st td.elite{background:rgba(57,255,20,.18);color:#157a0a;font-weight:800;border-radius:3px}
.pct-title-bar{padding:14px 24px 0;display:flex;align-items:baseline;gap:8px}
.pct-title-year{font-family:'Roboto Condensed',sans-serif;font-weight:800;font-size:1.1em;color:var(--brand-blue)}
.pct-title-text{font-family:'Roboto Condensed',sans-serif;font-weight:700;font-size:1.1em}
.pct-title-savant{font-family:'Roboto Condensed',sans-serif;font-weight:400;font-size:.85em;color:#aaa;margin-left:4px}
.pct-section{padding:6px 24px 24px}
.scale-row{display:flex;align-items:center;justify-content:flex-end;padding:10px 0 14px;gap:30px}
.sc{font-family:'Roboto Condensed',sans-serif;font-size:.72em;font-weight:800;letter-spacing:1.5px}
.sc.poor{color:#dc2626}.sc.avg{color:#aaa}.sc.great{color:#15803d}
.sc-arrow{color:#ccc;font-size:.55em}
.cat{margin-bottom:18px}
.cat-head{display:flex;align-items:center;gap:8px;padding-bottom:5px;border-bottom:3px solid var(--brand-blue);margin-bottom:2px}
.cat-icon{font-size:.85em}
.cat-name{font-family:'Roboto Condensed',sans-serif;font-weight:800;font-size:.95em;text-transform:uppercase;letter-spacing:.5px}
.sr{display:grid;grid-template-columns:155px 1fr 55px;align-items:center;padding:7px 0;gap:12px}
.sr+.sr{border-top:1.5px dashed #c0c8d0}
.sr-name{font-family:'Roboto Condensed',sans-serif;font-size:.88em;font-weight:600;color:#444;text-align:right;padding-right:10px}
.sr-bar{position:relative;height:36px;display:flex;align-items:center}
.sr-track{position:absolute;left:0;right:0;height:11px;background:var(--bar-track);border-radius:5px}
.sr-fill{position:absolute;left:0;height:11px;border-radius:5px;transition:width .7s cubic-bezier(.22,1,.36,1)}
.sr-circle{position:absolute;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Roboto Condensed',sans-serif;font-size:.85em;font-weight:800;color:white;transform:translateX(-50%);transition:left .7s cubic-bezier(.22,1,.36,1);z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2.5px solid rgba(255,255,255,.7)}
.sr-val{font-family:'Roboto Condensed',sans-serif;font-size:1.15em;font-weight:800;text-align:left;color:var(--text)}
.card-footer{padding:10px 24px;border-top:1px solid #ddd;font-size:.68em;color:#aaa;text-align:center;font-family:'Roboto Condensed',sans-serif}
.empty-state{text-align:center;padding:80px 20px}
.empty-state h2{font-family:'Roboto Condensed',sans-serif;font-size:1.5em;margin-bottom:8px;color:var(--brand-blue)}
.empty-state p{color:#999;font-size:.92em}
@media(max-width:700px){
.player-header{flex-direction:column}
.player-id-area{width:100%;flex-direction:row;gap:14px;padding:14px;border-right:none;border-bottom:1px solid #ddd}
.player-headshot{width:70px;height:52px}
.player-name-block{text-align:left;margin-top:0}
.team-logo-wrap{width:50px;height:50px}
.team-logo-wrap img{max-width:50px;max-height:50px}
.team-badge-fb{width:50px;height:50px;font-size:.9em}
.sr{grid-template-columns:110px 1fr 46px;gap:6px}
.pct-section{padding:6px 14px 16px}
.sr-circle{width:30px;height:30px;font-size:.72em}
}
</style>
</head>

function init(){allPlayers=RAW_DATA.map(p=>{addPG(p);return p;});applyFilter();document.getElementById('playerCount').textContent=filteredPlayers.length+' players in pool';}
function addPG(p){const g=parseInt(p.G)||1,d=k=>(parseInt(p[k]||0)/g).toFixed(1);p.PTS_PG=d('PTS');p.AST_PG=d('AST');p.TRB_PG=d('TRB');p.STL_PG=d('STL');p.BLK_PG=d('BLK');p.MP_PG=d('MP');p.FG_PG=d('FG');p.FGA_PG=d('FGA');p['3P_PG']=d('3P');p.FT_PG=d('FT');p.TOV_PG=d('TOV');}

function updateFilter(){applyFilter();if(document.getElementById('playerCard').style.display==='block'){const p=allPlayers.find(x=>x.Player===document.getElementById('pName').textContent);if(p)showPlayer(p);}}

function pick(name){const p=allPlayers.find(x=>x.Player===name);if(p){showPlayer(p);sI.value=name;sS.style.display='none';document.getElementById('emptyState').style.display='none';setTimeout(()=>document.getElementById('playerCard').scrollIntoView({behavior:'smooth',block:'start'}),60);}}
function calcPct(val,key,higher){const nums=filteredPlayers.map(p=>parseFloat(p[key])).filter(v=>!isNaN(v));const n=parseFloat(val);if(isNaN(n)||!nums.length)return null;return Math.round(((higher?nums.filter(v=>v<n):nums.filter(v=>v>n)).length/nums.length)*100);}
function pctColor(p){if(p>=90)return lerp([40,220,20],[57,255,20],(p-90)/10);if(p>=70)return lerp([160,200,40],[40,220,20],(p-70)/20);if(p>=50)return lerp([200,170,50],[160,200,40],(p-50)/20);if(p>=30)return lerp([210,110,40],[200,170,50],(p-30)/20);if(p>=15)return lerp([200,55,40],[210,110,40],(p-15)/15);return lerp([170,30,30],[200,55,40],p/15);}
function lerp(a,b,t){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';}
function barFill(p){if(p>=50)return 'rgba(57,200,20,'+(0.10+((p-50)/50)*0.42).toFixed(2)+')';return 'rgba(210,50,40,'+(0.10+((50-p)/50)*0.42).toFixed(2)+')';}
function fv(val,s){if(val===''||val===undefined)return'—';const n=parseFloat(val);if(isNaN(n))return val;if(s.f==='pct')return(n<1?(n*100).toFixed(1):n.toFixed(1));if(s.f==='dec')return n.toFixed(3);if(Math.abs(n)<10&&n%1!==0)return n.toFixed(1);return val;}
function fp(v){const n=parseFloat(v);return isNaN(n)?'—':(n<1?(n*100).toFixed(1):n.toFixed(1));}
function isElite(val,key,higher){const pct=calcPct(val,key,higher);return pct!==null&&pct>=95;}
function ec(val,key,higher,display){if(display==='—')return'<td>—</td>';if(isElite(val,key,higher))return'<td class="elite">'+display+'</td>';return'<td>'+display+'</td>';}
